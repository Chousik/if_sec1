name: CI and security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sast:
    name: SAST (SpotBugs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run SpotBugs
        run: >-
          ./mvnw -B clean compile
          com.github.spotbugs:spotbugs-maven-plugin:4.9.6.0:spotbugs
          -Dspotbugs.xmlOutput=true
        continue-on-error: true

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          if-no-files-found: warn

  sca:
    name: SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Generate NVD cache key
        id: nvd-cache-key
        run: echo "week=$(date +'%G-%V')" >> "$GITHUB_OUTPUT"

      - name: Cache Dependency-Check database
        uses: actions/cache@v4
        with:
          path: ~/.cache/dependency-check
          key: dependency-check-${{ runner.os }}-${{ steps.nvd-cache-key.outputs.week }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ./mvnw -B org.owasp:dependency-check-maven:12.1.6:check \
            -DdataDirectory="$HOME/.cache/dependency-check" \
            -DnvdApiKeyEnvironmentVariable=NVD_API_KEY \
            -Dformat=HTML \
            -DfailBuildOnCVSS=7

      - name: Upload Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: target/dependency-check-report.html
          if-no-files-found: warn
