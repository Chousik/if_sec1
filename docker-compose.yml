services:
  postgres:
    image: postgres:16-alpine
    container_name: infosec-lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infosec}
      POSTGRES_USER: ${POSTGRES_USER:-infosec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infosec}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infosec} -d ${POSTGRES_DB:-infosec}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
