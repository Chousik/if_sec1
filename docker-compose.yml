services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infosec}
      POSTGRES_USER: ${POSTGRES_USER:-infosec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infosec}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
